name: Build NMSMenu

on:
  workflow_dispatch:
  push:
    paths:
      - 'nms-menu/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    # macOS runner 需要计费额度，这里走 Linux + clang + lld 直编
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 clang / lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld git curl xz-utils libssl-dev
          clang --version
          ld64.lld --version || true

      - name: 安装 ldid（下载官方 Linux 构建）
        run: |
          sudo curl -sL -o /usr/local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid
          ldid -h 2>&1 | head -3 || true

      - name: 拉取 iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          ls /tmp/sdks | grep iPhoneOS

      - name: 编译 dylib
        run: |
          cd nms-menu
          chmod +x build.sh
          SDK=$(ls -d /tmp/sdks/iPhoneOS*.sdk | sort -V | tail -1)
          ./build.sh "$SDK"

      - name: 校验产物
        run: |
          cd nms-menu
          ls -la NMSMenu.dylib
          python3 ../tools/macho_lc.py NMSMenu.dylib
          echo "--- 必须看到 LC_CODE_SIGNATURE ---"
          python3 ../tools/macho_lc.py NMSMenu.dylib | grep -q LC_CODE_SIGNATURE \
            && echo "签名 OK" || (echo "缺少代码签名！" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: NMSMenu-dylib
          path: nms-menu/NMSMenu.dylib
          if-no-files-found: error
